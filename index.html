<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>香草人格测试</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      background: #f5f0e8;
      color: #3a2e1e;
      min-height: 100vh;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 20px 16px 60px;
    }

    /* 封面 */
    .cover {
      text-align: center;
      padding: 60px 20px;
    }
    .cover-icon { font-size: 64px; margin-bottom: 20px; }
    .cover h1 {
      font-size: 28px;
      font-weight: 700;
      color: #2d4a1c;
      margin-bottom: 12px;
      letter-spacing: 2px;
    }
    .cover p {
      font-size: 15px;
      color: #6b5c4a;
      line-height: 1.8;
      margin-bottom: 8px;
    }
    .cover-divider {
      width: 40px; height: 2px;
      background: #8fbc6a;
      margin: 20px auto;
      border-radius: 2px;
    }
    .cover-note {
      font-size: 13px;
      color: #9b8b7a;
      margin-top: 24px;
    }
    .btn-start {
      display: inline-block;
      margin-top: 32px;
      padding: 14px 40px;
      background: #4a7c2f;
      color: #fff;
      border: none;
      border-radius: 30px;
      font-size: 16px;
      cursor: pointer;
      letter-spacing: 2px;
      transition: background 0.3s;
    }
    .btn-start:hover { background: #3d6626; }

    /* 进度条 */
    .progress-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
      font-size: 13px;
      color: #8a7a6a;
    }
    .progress-bar-bg {
      flex: 1;
      height: 4px;
      background: #d8cfc2;
      border-radius: 2px;
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      background: #8fbc6a;
      border-radius: 2px;
      transition: width 0.4s ease;
    }

    /* 题目 */
    .question-card {
      background: #fff;
      border-radius: 16px;
      padding: 28px 24px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    }
    .q-number {
      font-size: 12px;
      color: #8fbc6a;
      letter-spacing: 1px;
      margin-bottom: 12px;
      font-weight: 600;
    }
    .q-text {
      font-size: 17px;
      color: #2d4a1c;
      line-height: 1.7;
      margin-bottom: 24px;
      font-weight: 500;
    }
    .q-dim-label {
      display: inline-block;
      font-size: 11px;
      color: #9b8b7a;
      background: #f0ebe2;
      padding: 3px 10px;
      border-radius: 20px;
      margin-bottom: 16px;
    }
    .option {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 14px 16px;
      border: 1.5px solid #e8e0d4;
      border-radius: 12px;
      margin-bottom: 10px;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 15px;
      line-height: 1.6;
      color: #4a3a28;
    }
    .option:hover { border-color: #8fbc6a; background: #f8f5ef; }
    .option.selected {
      border-color: #4a7c2f;
      background: #eef5e8;
    }
    .option-letter {
      flex-shrink: 0;
      width: 26px; height: 26px;
      border-radius: 50%;
      background: #e8e0d4;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 600;
      color: #8a7a6a;
      transition: all 0.2s;
      margin-top: 1px;
    }
    .option.selected .option-letter {
      background: #4a7c2f;
      color: #fff;
    }

    /* 导航按钮 */
    .nav-btns {
      display: flex;
      gap: 12px;
      margin-top: 24px;
    }
    .btn-prev, .btn-next {
      flex: 1;
      padding: 13px;
      border-radius: 30px;
      font-size: 15px;
      cursor: pointer;
      border: none;
      transition: all 0.3s;
    }
    .btn-prev {
      background: #e8e0d4;
      color: #6b5c4a;
    }
    .btn-prev:hover { background: #d8cfc2; }
    .btn-next {
      background: #4a7c2f;
      color: #fff;
    }
    .btn-next:hover { background: #3d6626; }
    .btn-next:disabled {
      background: #c8d8be;
      cursor: not-allowed;
    }

    /* 结果页 */
    .result-page { display: none; }
    .result-card {
      background: #fff;
      border-radius: 20px;
      padding: 36px 28px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      text-align: center;
      margin-bottom: 20px;
    }
    .result-emoji { font-size: 56px; margin-bottom: 16px; }
    .result-type {
      font-size: 26px;
      font-weight: 700;
      color: #2d4a1c;
      margin-bottom: 4px;
      letter-spacing: 2px;
    }
    .result-mbti {
      font-size: 14px;
      color: #8fbc6a;
      font-weight: 600;
      letter-spacing: 2px;
      margin-bottom: 20px;
    }
    .result-divider {
      width: 36px; height: 2px;
      background: #8fbc6a;
      margin: 16px auto;
      border-radius: 2px;
    }

    /* 人格属性区块 */
    .attr-block {
      background: #f8f5ef;
      border-radius: 12px;
      padding: 16px 20px;
      text-align: left;
      margin-bottom: 12px;
    }
    .attr-title {
      font-size: 12px;
      color: #8fbc6a;
      font-weight: 700;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }
    .attr-text {
      font-size: 14px;
      color: #5a4a38;
      line-height: 1.9;
    }

      background: #eef5e8;
      border-radius: 12px;
      padding: 20px;
      text-align: left;
      margin-top: 16px;
    }

      font-size: 13px;
      color: #4a7c2f;
      font-weight: 700;
      letter-spacing: 1px;
      margin-bottom: 10px;
    }
    .insight-text {
      font-size: 15px;
      color: #3a2e1e;
      line-height: 1.9;
    }

    /* 种植建议区块 */
    .plant-block {
      background: #fef9f0;
      border: 1px solid #f0e0c0;
      border-radius: 12px;
      padding: 20px;
      text-align: left;
      margin-top: 16px;
    }
    .plant-title {
      font-size: 13px;
      color: #a07830;
      font-weight: 700;
      letter-spacing: 1px;
      margin-bottom: 10px;
    }
    .plant-text {
      font-size: 15px;
      color: #5a4030;
      line-height: 1.9;
    }
        /* 品牌露出 */
    .brand-line {
      margin-top: 28px;
      padding-top: 20px;
      border-top: 1px solid #e8e0d4;
      text-align: center;
      font-size: 13px;
      color: #8a7a6a;
      line-height: 1.8;
    }
    .brand-line strong {
      color: #4a7c2f;
      font-weight: 600;
    }


    /* 重新测试 */
    .btn-retest {
      display: block;
      width: 100%;
      padding: 14px;
      background: #e8e0d4;
      color: #6b5c4a;
      border: none;
      border-radius: 30px;
      font-size: 15px;
      cursor: pointer;
      margin-top: 16px;
      transition: background 0.3s;
    }
    .btn-retest:hover { background: #d8cfc2; }

    /* 分享提示 */
    .share-tip {
      text-align: center;
      font-size: 13px;
      color: #9b8b7a;
      margin-top: 24px;
      line-height: 1.7;
    }

    /* 隐藏 */
    .hidden { display: none !important; }

    /* 动画 */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .fade-in { animation: fadeIn 0.5s ease forwards; }

    /* loading */
    .loading {
      text-align: center;
      padding: 60px 20px;
      color: #8fbc6a;
      font-size: 15px;
    }
  </style>
</head>
<body>
<div class="container">

  <!-- 封面 -->
  <div id="cover" class="cover">
    <div class="cover-icon">🌿</div>
    <h1>香草人格测试</h1>
    <div class="cover-divider"></div>
    <p>16道题，找到你的香草人格</p>
    <p>每株香草都有自己的性格<br>你也是</p>
    <p class="cover-note">约需 3 分钟 · 16道选择题 · 16种人格类型</p>
    <button class="btn-start" onclick="startTest()">开始测试</button>
  </div>

  <!-- 测试区 -->
  <div id="test-area" class="hidden">
    <div class="progress-wrap">
      <span id="progress-text">第 1 / 16 题</span>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progress-fill" style="width:0%"></div>
      </div>
    </div>

    <div class="question-card fade-in" id="question-card">
      <div class="q-number" id="q-number"></div>
      <div class="q-dim-label" id="q-dim-label"></div>
      <div class="q-text" id="q-text"></div>
      <div id="options-container"></div>
    </div>

    <div class="nav-btns">
      <button class="btn-prev" id="btn-prev" onclick="prevQuestion()" disabled>上一题</button>
      <button class="btn-next" id="btn-next" onclick="nextQuestion()" disabled>下一题</button>
    </div>
  </div>

  <!-- 结果页 -->
  <div id="result-page" class="result-page hidden">
    <div class="result-card fade-in" id="result-card">
      <!-- 动态填充 -->
    </div>
    <p class="share-tip">长按保存结果图<br>或截图分享给你的朋友 🌿</p>
    <button class="btn-retest" onclick="restartTest()">重新测试</button>
  </div>

</div>

// ─────────────────────────────────────────
// 状态
// ─────────────────────────────────────────
let currentQ = 0;
let answers = new Array(16).fill(null); // 0=A, 1=B
let dimScores = { D1: 0, D2: 0, D3: 0, D4: 0 };

// ─────────────────────────────────────────
// 逻辑
// ─────────────────────────────────────────
function startTest() {
  document.getElementById('cover').classList.add('hidden');
  document.getElementById('test-area').classList.remove('hidden');
  renderQuestion();
}

function renderQuestion() {
  const q = questions[currentQ];
  document.getElementById('q-number').textContent = '第 ' + (currentQ + 1) + ' / 16 题';
  document.getElementById('q-dim-label').textContent = q.dimLabel;
  document.getElementById('q-text').textContent = q.text;
  document.getElementById('progress-text').textContent = '第 ' + (currentQ + 1) + ' / 16 题';
  document.getElementById('progress-fill').style.width = ((currentQ) / 16 * 100) + '%';

  const container = document.getElementById('options-container');
  container.innerHTML = '';
  q.options.forEach((opt, idx) => {
    const div = document.createElement('div');
    div.className = 'option' + (answers[currentQ] === idx ? ' selected' : '');
    div.innerHTML = '<span class="option-letter">' + opt.letter + '</span><span>' + opt.text + '</span>';
    div.onclick = () => selectOption(idx);
    container.appendChild(div);
  });

  document.getElementById('btn-prev').disabled = currentQ === 0;
  updateNextBtn();
}

function selectOption(idx) {
  answers[currentQ] = idx;
  document.querySelectorAll('.option').forEach((el, i) => {
    el.classList.toggle('selected', i === idx);
  });
  updateNextBtn();
}

function updateNextBtn() {
  const btn = document.getElementById('btn-next');
  btn.disabled = answers[currentQ] === null;
  if (currentQ === 15) {
    btn.textContent = '查看结果';
  } else {
    btn.textContent = '下一题';
  }
}

function nextQuestion() {
  if (answers[currentQ] === null) return;

  // 更新进度
  document.getElementById('progress-fill').style.width = ((currentQ + 1) / 16 * 100) + '%';

  if (currentQ < 15) {
    currentQ++;
    // 重新触发动画
    const card = document.getElementById('question-card');
    card.classList.remove('fade-in');
    void card.offsetWidth;
    card.classList.add('fade-in');
    renderQuestion();
  } else {
    showResult();
  }
}

function prevQuestion() {
  if (currentQ > 0) {
    currentQ--;
    const card = document.getElementById('question-card');
    card.classList.remove('fade-in');
    void card.offsetWidth;
    card.classList.add('fade-in');
    renderQuestion();
  }
}

function calculateScores() {
  dimScores = { D1: 0, D2: 0, D3: 0, D4: 0 };
  answers.forEach((ans, qIdx) => {
    if (ans !== null) {
      const q = questions[qIdx];
      const opt = q.options[ans];
      dimScores.D1 += opt.scores.D1;
      dimScores.D2 += opt.scores.D2;
      dimScores.D3 += opt.scores.D3;
      dimScores.D4 += opt.scores.D4;
    }
  });
}

function matchPersonality() {
  const d1 = dimScores.D1 >= 3 ? 1 : 0;
  const d2 = dimScores.D2 >= 3 ? 1 : 0;
  const d3 = dimScores.D3 >= 3 ? 1 : 0;
  const d4 = dimScores.D4 >= 3 ? 1 : 0;
  const key = d1 + ',' + d2 + ',' + d3 + ',' + d4;

  // 姜黄特殊处理：D1<3, D2≥3, D3≥3, D4≥3（key="1,1,1,1" 与月桂key相同，优先判断）
  if (dimScores.D1 < 3 && dimScores.D2 >= 3 && dimScores.D3 >= 3 && dimScores.D4 >= 3) {
    return {
      type: "姜黄型", mbti: "ISTP", emoji: "🌿",
      attrs: "行星属性：太阳 ☀️ / 木星 ♃ · 元素：火/土 · 力量：力量、净化、成功、保护、繁荣",
      insight: "你像姜黄，块茎深埋地下，蓄积能量，等到对的时机才出来。不是慢，是知道自己的节奏。你的颜色是太阳的金黄，但你不是一个会说漂亮话的人——你是那种直接解决问题的人：切开，用。别人遇到问题会想很久，你会先动手，然后边做边想。你不太需要别人理解你在做什么，你理解自己在做什么就够了。",
      plant: "需要深盆（30cm以上）和耐心：春种秋收。种下去之后大部分时间不用管。表面覆土3-5cm，保持湿润即可。"
    };
  }

  return personalityTypes[key] || {
    type: "未知", mbti: "?", emoji: "🌿",
    attrs: "",
    insight: "未找到匹配人格",
    plant: ""
  };
}

function showResult() {
  try {
    calculateScores();
    const result = matchPersonality();

    document.getElementById('test-area').classList.add('hidden');
    const resultPage = document.getElementById('result-page');
    resultPage.classList.remove('hidden');
    resultPage.style.display = 'block';
    document.getElementById('progress-fill').style.width = '100%';

    const card = document.getElementById('result-card');
    card.classList.remove('fade-in');
    void card.offsetWidth;
    card.innerHTML = `
    <div class="result-emoji">${result.emoji}</div>
    <div class="result-type">${result.type}</div>
    <div class="result-mbti">${result.mbti}</div>
    <div class="result-divider"></div>

    <div class="attr-block">
      <div class="attr-title">【香草属性】</div>
      <div class="attr-text">${result.attrs}</div>
    </div>

    <div class="insight-block">
      <div class="insight-title">【香草人格】</div>
      <div class="insight-text">${result.insight}</div>
    </div>

    <div class="plant-block">
      <div class="plant-title">【种植建议】</div>
      <div class="plant-text">${result.plant}</div>
    </div>
        <div class="brand-line">
      <strong>自然植得工作室</strong>｜为人与自然间的创造性连接在行动！
    </div>

    `;
    card.classList.add('fade-in');
  } catch(e) {
    alert('出错了：' + e.message);
  }
}

function restartTest() {
  currentQ = 0;
  answers = new Array(16).fill(null);
  dimScores = { D1: 0, D2: 0, D3: 0, D4: 0 };
  document.getElementById('result-page').classList.add('hidden');
  document.getElementById('test-area').classList.remove('hidden');
  renderQuestion();
}
</script>
